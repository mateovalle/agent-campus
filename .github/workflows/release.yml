name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg
            artifacts: release/*.dmg
          - os: ubuntu-latest
            args: --linux AppImage
            artifacts: release/*.AppImage
          - os: windows-latest
            args: --win nsis
            artifacts: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install webview dependencies
        run: npm ci
        working-directory: webview-ui
      - name: Verify tag matches package.json version
        run: node -e "const v=require('./package.json').version, t=process.env.GITHUB_REF_NAME.replace(/^v/,''); if(v!==t){console.error('package.json '+v+' != tag '+t); process.exit(1)}"
      - name: Build app
        run: npm run build:electron && npm run build:webview
      # Signing is opt-in on the presence of the secrets, so a fork — and this
      # repo until the maintainer enrols in the Apple Developer Program — still
      # produces a release.
      #
      # The variables are EXPORTED rather than set in the Package step's env,
      # because electron-builder reads them by PRESENCE: `CSC_LINK=''` is not
      # "unsigned", it is "the certificate is at the empty path", which it
      # resolves against the repo root and fails on with "not a file". That
      # failed the v0.4.0 macOS build while Linux and Windows sailed through,
      # and it cannot happen locally, where the variable is simply absent.
      - name: Signing environment
        id: signing
        shell: bash
        env:
          MAC_CERT: ${{ secrets.CSC_LINK }}
          MAC_CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CERT: ${{ secrets.WIN_CSC_LINK }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signed=false
          notarized=false
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CERT" ]; then
            echo "CSC_LINK=$MAC_CERT" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD" >> "$GITHUB_ENV"
            signed=true
            # Notarization is a separate credential from the certificate, and
            # asking for it without one fails the build.
            if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_TEAM_ID" ]; then
              echo "APPLE_ID=$NOTARY_APPLE_ID" >> "$GITHUB_ENV"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$NOTARY_PASSWORD" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID" >> "$GITHUB_ENV"
              notarized=true
            fi
          fi
          # WIN_CSC_* rather than the generic CSC_*: electron-builder would
          # otherwise hand a macOS .p12 to signtool.
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CERT" ]; then
            echo "WIN_CSC_LINK=$WIN_CERT" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CERT_PASSWORD" >> "$GITHUB_ENV"
            signed=true
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "notarized=$notarized" >> "$GITHUB_OUTPUT"
          if [ "$notarized" = "true" ]; then
            echo "extra=--config.mac.notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "extra=" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never ${{ steps.signing.outputs.extra }}
      # A signed build that Gatekeeper still rejects is the failure worth
      # catching here: it looks identical to an unsigned one once a user has
      # downloaded it. The two checks are separate because signing and
      # notarizing are separate credentials — a signed, un-notarized build is
      # a legitimate state that spctl correctly refuses.
      - name: Verify the macOS build is signed
        if: runner.os == 'macOS' && steps.signing.outputs.signed == 'true'
        run: |
          APP="release/mac-arm64/Agent Campus.app"
          [ -d "$APP" ] || APP="release/mac/Agent Campus.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Verify Gatekeeper accepts it
        if: runner.os == 'macOS' && steps.signing.outputs.notarized == 'true'
        run: |
          APP="release/mac-arm64/Agent Campus.app"
          [ -d "$APP" ] || APP="release/mac/Agent Campus.app"
          spctl --assess --type execute --verbose=4 "$APP"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          draft: false
          generate_release_notes: true
