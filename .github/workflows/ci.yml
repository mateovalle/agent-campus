name: CI

on:
  push:
    branches: [main, electron-migration]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung step otherwise burns the runner's full six-hour budget and the PR
    # never reports. Everything here finishes in ~90s.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install webview dependencies
        run: npm ci
        working-directory: webview-ui
      - name: Type-check (src, electron, webview)
        run: npm run check-types
      - name: Lint (src, electron)
        run: npm run lint
      - name: Lint (webview)
        run: npm run lint:webview
      # TEMPORARY, three steps instead of one: something in the campus socket
      # suite hangs on Linux and nothing else does, and a hang in the event
      # loop (a blocking socket read, execFileSync) defeats vitest's own
      # per-test timeouts, so the run dies by wall-clock with no failure to
      # read. Isolating the suspects names the culprit in a single run.
      - name: Test (everything but the campus socket)
        timeout-minutes: 3
        run: npm test -- --no-file-parallelism --exclude '**/campusServer.test.ts' --exclude '**/campusSocket.integration.test.ts'
      - name: Test (campus socket, unit)
        timeout-minutes: 2
        # TAP streams a line per test as it finishes, so if this still hangs
        # the log names the test instead of the file. The default reporter
        # prints nothing until a whole file completes.
        run: npm test -- campusServer.test --reporter=tap-flat
      - name: Test (campus socket, integration)
        timeout-minutes: 2
        run: npm test -- campusSocket.integration
      - name: Build webview
        run: npm run build:webview
      - name: Build electron main
        run: npm run build:electron
